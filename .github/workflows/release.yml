name: Release

# Releases are tagged from `main`. There are two ways to fire this
# pipeline:
#   1. Push a tag matching `v*` directly (e.g. `git push origin v0.2.0`).
#   2. `workflow_dispatch` against a `v*` tag ref. This is how
#      `version-bump.yml` triggers a publish — tag pushes authored by
#      the default `GITHUB_TOKEN` do NOT fire `on: push: tags` workflows
#      (a long-standing GitHub safety feature), so the bump job calls
#      `gh workflow run release.yml --ref vX.Y.Z -f dry_run=false`
#      after pushing the tag.
#
# This workflow:
#   1. Runs the 1.0-rc gate (`cargo xtask verify`) so a tag never
#      ships an untested build.
#   2. Builds release binaries (`atomr-dashboard`, `atomr-profiler`)
#      for Linux x86_64 + macOS aarch64.
#   3. Creates the GitHub Release with the artifacts attached.
#   4. Publishes every publishable Rust crate to crates.io in
#      dependency order. Honors `--dry-run` for `workflow_dispatch`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish + maturin upload with --dry-run; skip GitHub Release upload"
        required: false
        default: "true"
      skip_python:
        description: "Skip the Python wheel build/publish jobs"
        required: false
        default: "false"
      skip_crates:
        description: "Skip the crates.io publish job"
        required: false
        default: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (1.0-rc gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask verify
        run: cargo xtask verify

  build-binaries:
    name: Build binaries (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
            bin_ext: .exe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build dashboard SPA (ui/dist for embed-ui)
        shell: bash
        working-directory: crates/atomr-dashboard/ui
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install cross (Linux aarch64)
        if: matrix.cross == true
        run: cargo install cross --locked
      - name: Build atomr-dashboard
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p atomr-dashboard --features bin,embed-ui,aggregator,metrics-prometheus
          else
            cargo build --release --target ${{ matrix.target }} -p atomr-dashboard --features bin,embed-ui,aggregator,metrics-prometheus
          fi
      - name: Build atomr-profiler
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p atomr-profiler
          else
            cargo build --release --target ${{ matrix.target }} -p atomr-profiler
          fi
      - name: Stage artifacts (unix)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p artifacts
          for bin in atomr-dashboard atomr-profiler; do
            src="target/${{ matrix.target }}/release/$bin"
            [ -f "$src" ] && cp "$src" "artifacts/${bin}-${{ matrix.target }}"
          done
          (cd artifacts && tar czf "atomr-${{ matrix.target }}.tar.gz" atomr-dashboard-* atomr-profiler-*)
      - name: Stage artifacts (windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          foreach ($bin in @("atomr-dashboard", "atomr-profiler")) {
            $src = "target/${{ matrix.target }}/release/$bin${{ matrix.bin_ext }}"
            if (Test-Path $src) { Copy-Item $src "artifacts/$bin-${{ matrix.target }}${{ matrix.bin_ext }}" }
          }
          Compress-Archive -Path "artifacts/atomr-dashboard-*","artifacts/atomr-profiler-*" -DestinationPath "artifacts/atomr-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: atomr-binaries-${{ matrix.target }}
          path: artifacts/atomr-${{ matrix.target }}.${{ matrix.archive_ext }}

  build-wheels:
    name: Build wheels (${{ matrix.target }} / ${{ matrix.os }})
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.skip_python != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc + musl, x86_64 + aarch64. maturin uses
          # manylinux/musllinux containers under the hood; the
          # `manylinux: auto` flag picks the right base image.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-target: x86_64
            manylinux: auto
          # aarch64 Linux glibc — built natively on a GitHub-hosted
          # ARM runner so we don't have to cross-compile `ring` /
          # `aws-lc-rs` inside the x86_64 manylinux container (which
          # was the reason this wheel was skipped before v0.3.1).
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python-target: aarch64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            python-target: x86_64
            manylinux: musllinux_1_2
          # aarch64 Linux musl — also built natively on the ARM
          # runner, mirroring the glibc coverage.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            python-target: aarch64
            manylinux: musllinux_1_2
          # macOS — universal2 yields a single fat wheel covering
          # both x86_64 and arm64 architectures.
          - os: macos-latest
            target: universal2-apple-darwin
            python-target: universal2
            manylinux: "off"
          # Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-target: x64
            manylinux: "off"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.python-target }}
          # Build a wheel per supported CPython ABI on this platform.
          args: --release --strip --out dist --interpreter "python3.10 python3.11 python3.12 python3.13"
          # `auto` builds inside a manylinux container; `off` runs natively.
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: atomr-wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist (Python)
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.skip_python != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: atomr-sdist
          path: dist/*.tar.gz

  github-release:
    name: GitHub Release
    needs: [verify, build-binaries, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Run for direct tag pushes AND for `workflow_dispatch` runs
    # targeting a `v*` ref with `dry_run=false` (the trampoline
    # path used by `version-bump.yml`).
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The two most recent tags; use HEAD as a fallback for the first release.
          prev=$(git tag --sort=-creatordate | grep -v "^${tag}$" | head -n1 || true)
          range="${prev:+$prev..}HEAD"
          {
            echo "## atomr ${tag}"
            echo
            echo "### Changes"
            git log --no-merges --pretty=format:'- %s (%h)' "${range}"
            echo
            echo
            echo "### Crates published"
            grep -E "atomr-[a-z-]+ = \{ path" Cargo.toml | sed 's/^/- /'
            echo
            echo "### Python wheels"
            ls artifacts | grep "atomr-wheels-" | sed 's/^/- /' || true
          } > RELEASE_NOTES.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: atomr ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(steps.notes.outputs.tag, '-') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.whl

  publish-crates:
    name: Publish to crates.io
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.skip_crates != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Walk every publishable crate in dependency order. Each
      # `cargo publish` waits briefly for the index to become visible
      # before moving on, so the next crate can resolve its
      # path-dependencies from crates.io. `already uploaded` is
      # treated as success so a partially-completed run can be
      # safely retried by re-tagging.
      - name: Publish all crates in dep order
        run: |
          set -euo pipefail
          # crates.io applies a "new crates per period" rate limit
          # (rolling window). Pace successful new-crate publishes
          # with a sleep, and retry transient 429s after a longer
          # backoff. Already-published crates are skipped in <1s
          # so a re-tag of the same version is cheap.
          publish_one() {
            local crate=$1
            local attempt=1
            while true; do
              echo "==> publishing $crate (attempt $attempt)"
              local out
              if out=$(cargo publish -p "$crate" 2>&1); then
                printf '%s\n' "$out"
                # Throttle between successful new-crate publishes.
                sleep 30
                return 0
              fi
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qE "already (uploaded|exists)"; then
                echo "    (already on crates.io — continuing)"
                return 0
              fi
              if printf '%s' "$out" | grep -qE "(429|Too Many Requests|rate.*limit)" && [ $attempt -lt 6 ]; then
                local delay=$((90 * attempt))
                echo "    (rate-limited — sleeping ${delay}s before retry)"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi
              return 1
            done
          }
          # Strict dep-order. Adding a new crate? Slot it into the
          # earliest layer that has all its dependencies already
          # published in earlier layers. The order below was derived
          # by reading the [dependencies] section of each crate's
          # Cargo.toml; if a crate fails to publish with a "version
          # not found" error, its dep is being published too late.
          for crate in \
            atomr-config atomr-money \
            atomr-core \
            atomr-serialization-hyperion \
            atomr-macros atomr-testkit \
            atomr-remote atomr-remote-serial \
            atomr-persistence atomr-streams \
            atomr-streams-io atomr-fix \
            atomr-coordination atomr-discovery atomr-di \
            atomr-cluster \
            atomr-persistence-tck atomr-persistence-query \
            atomr-hosting \
            atomr-distributed-data atomr-distributed-data-lmdb \
            atomr-cluster-tools atomr-cluster-metrics \
            atomr-persistence-query-inmemory atomr-persistence-sql \
            atomr-persistence-redis atomr-persistence-mongodb \
            atomr-persistence-cassandra atomr-persistence-aws \
            atomr-persistence-azure \
            atomr-cluster-sharding \
            atomr-patterns \
            atomr-telemetry \
            atomr-dashboard \
            atomr \
            atomr-profiler; do
            publish_one "$crate"
          done

  publish-crates-dry-run:
    name: Publish to crates.io (dry run)
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run publish (foundation crates)
        run: |
          for c in atomr-config atomr-money atomr-macros atomr-core atomr-serialization-hyperion \
                   atomr-testkit atomr-remote atomr-remote-serial \
                   atomr-distributed-data atomr-distributed-data-lmdb \
                   atomr-cluster atomr-persistence atomr-streams atomr-streams-io atomr-fix \
                   atomr-cluster-sharding atomr-patterns atomr atomr-profiler; do
            echo "==> $c"
            cargo publish -p "$c" --dry-run --allow-dirty || true
          done

  publish-pypi:
    name: Publish wheels + sdist to PyPI
    needs: [verify, build-wheels, build-sdist, github-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.skip_python != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
    # Trusted publishing — configure on PyPI: pypi.org → manage project →
    # publishing → add GitHub publisher (owner / repo / workflow / env).
    environment:
      name: pypi
      url: https://pypi.org/p/atomr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only Python artifacts — binary tarballs share the
          # `*.tar.gz` extension with the sdist but are not valid
          # PyPI uploads, so download just the wheel + sdist
          # artifact buckets.
          pattern: "atomr-{wheels-*,sdist}"
      - name: Flatten wheel + sdist artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          ls -la upload/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          # If trusted publishing is not yet configured, set
          # `password: ${{ secrets.PYPI_API_TOKEN }}` instead.
          skip-existing: true

  publish-pypi-dry-run:
    name: PyPI dry-run (TestPyPI)
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && github.event.inputs.skip_python != 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/atomr
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "atomr-{wheels-*,sdist}"
      - name: Flatten wheel + sdist artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          ls -la upload/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
