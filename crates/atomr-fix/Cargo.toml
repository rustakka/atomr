[package]
name = "atomr-fix"
description = "FIX session-layer for atomr — logon/heartbeat/sequence/resend/gap-fill session FSM over atomr-streams Tcp + Framing, with a pluggable persistent sequence store."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/atomr-fix"
keywords = ["actor", "fix", "trading", "session", "protocol"]
categories = ["network-programming", "finance"]

[dependencies]
atomr-core = { workspace = true }
atomr-streams = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
default = ["fix44"]
fix42 = []
fix44 = []
fix50 = []

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
